name: Verify the tablet game on Netlify
on:
  push:
    branches: [verify/tablet-game]
permissions:
  contents: read
jobs:
  tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise touch controls on the published game
        run: |
          npm install --prefix "$RUNNER_TEMP/mars-ui-test" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          export NODE_PATH="$RUNNER_TEMP/mars-ui-test/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          export SCREENSHOTS="$RUNNER_TEMP/mars-tablet-screenshots"
          node tests/browser/tablet.cjs
      - name: Save both tablet orientations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mars-tablet
          path: ${{ runner.temp }}/mars-tablet-screenshots
          retention-days: 7
      - name: Prepare small previews of both test screens
        run: |
          python3 -m venv "$RUNNER_TEMP/mars-thumbnails"
          "$RUNNER_TEMP/mars-thumbnails/bin/pip" install -q Pillow==11.3.0
          "$RUNNER_TEMP/mars-thumbnails/bin/python" - <<'PY'
          import base64, io, os
          from pathlib import Path
          from PIL import Image
          directory = Path(os.environ['RUNNER_TEMP']) / 'mars-tablet-screenshots'
          for key, filename in [('wide', 'Mars-tablet-na-sirku.jpg'), ('tall', 'Mars-tablet-na-vysku.jpg')]:
              image = Image.open(directory / filename)
              image.thumbnail((850,850),Image.Resampling.LANCZOS)
              buf = io.BytesIO()
              image.save(buf,format='WEBP',quality=59,method=5)
              data = base64.b64encode(buf.getvalue()).decode('ascii')
              print(f'MARS_PREVIEW_SIZE_{key}={len(data)}')
              for offset in range(0,len(data),1000):
                  print(f'MARS_PREVIEW_PART_{key}_{offset}={data[offset:offset+1000]}')
          PY
