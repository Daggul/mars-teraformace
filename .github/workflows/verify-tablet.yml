name: Verify the tablet game on Netlify
on:
  push:
    branches: [verify/tablet-game]
permissions:
  contents: read
jobs:
  tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise touch controls on the published game
        run: |
          npm install --prefix "$RUNNER_TEMP/mars-ui-test" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          export NODE_PATH="$RUNNER_TEMP/mars-ui-test/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          export SCREENSHOTS="$RUNNER_TEMP/mars-tablet-screenshots"
          node tests/browser/tablet.cjs
      - name: Save both tablet orientations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mars-tablet
          path: ${{ runner.temp }}/mars-tablet-screenshots
          retention-days: 7
      - name: Prepare small inline previews of the two public test screens
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const path = require('node:path');
          const dir = path.join(process.env.RUNNER_TEMP, 'mars-tablet-screenshots');
          for (const [key, file] of [['wide','Mars-tablet-na-sirku'],['tall','Mars-tablet-na-vysku']]) {
            const input = path.join(dir, file + '.jpg');
            const output = path.join(dir, key + '.webp');
            execFileSync('convert', [input, '-resize', '840x840>', '-define', 'webp:target-size=25000', '-quality', '65', output]);
            const b64 = fs.readFileSync(output).toString('base64');
            console.log('MARS_PREVIEW_SIZE_' + key + '=' + b64.length);
            for (let offset = 0; offset < b64.length; offset += 1200) {
              console.log('MARS_PREVIEW_PART_' + key + '_' + offset + '=' + b64.slice(offset, offset + 1200));
            }
          }
          JS
